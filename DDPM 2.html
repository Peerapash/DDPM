<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ฟังเพลงจากผลงาน AI</title>
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      color: white;
      background-image: url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      padding: 20px;
      backdrop-filter: brightness(0.75);
    }

    .container {
      background-color: rgba(0, 0, 0, 0.75);
      padding: 30px;
      border-radius: 20px;
      max-width: 700px;
      margin: auto;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
    }

    h2, h3 {
      text-align: center;
      color: #00eaff;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
    }

    iframe {
      width: 100%;
      margin: 20px 0;
      border: none;
    }

    .song-section {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>โครงการเสริมสร้างค่านิยมองค์กรด้วยปัญญาประดิษฐ์เพื่อสร้างวัฒนธรรมองค์กรที่มั่นคงและยั่งยืน AI</h2>

    <label for="workSelector">เลือกผลงาน</label>
    <select id="workSelector" onchange="updateSong()">
      <option value="">-- กรุณาเลือก --</option>
    </select>

    <div class="song-section">
      <h3 id="songTitle">กรุณาเลือกผลงาน</h3>
      <div id="playerContainer"></div>
    </div>
  </div>

  <script>
    const songs = [
      {
        title: "We are ddpm",
        url: "https://drive.google.com/file/d/1YR5TpC2-EhSQ9hipZEBEw_ColWgs0thH/preview"
      },
      {
        title: "รวมพลัง ปภ",
        url: "https://drive.google.com/file/d/1oIJeoz_-TEH5C2fNNQVWieBcylgLng9m/preview"
      },
      {
        title: "DDPM Team",
        url: "https://drive.google.com/file/d/1dk1OqkSw-2N7JaVIzTbyI_2NxZEyvMlm/preview"
      },
      {
        title: "แค่ขอให้เธอนอนหลับฝันดีv1",
        url: ""
      },
      {
        title: "แค่ขอให้เธอนอนหลับฝันดีv2",
        url: ""
      },
      {
        title: "ทุกลมหายใจ",
        url: ""
      }
    ];

    for (let i = 6; i < 20; i++) {
      songs.push({
        title: `ผลงานที่ ${i + 1}`,
        url: ""
      });
    }

    // เพิ่มตัวเลือกใน Select แบบ Dynamic
    const selector = document.getElementById("workSelector");
    songs.forEach((song, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = song.title;
      selector.appendChild(option);
    });

    function updateSong() {
      const index = document.getElementById("workSelector").value;
      const title = document.getElementById("songTitle");
      const container = document.getElementById("playerContainer");

      if (index === "") {
        title.innerText = "กรุณาเลือกผลงาน";
        container.innerHTML = "";
      } else {
        const song = songs[index];
        title.innerText = song.title;
        container.innerHTML = song.url
          ? `<iframe src="${song.url}" height="80" allow="autoplay"></iframe>`
          : `<p style='color: #ccc; text-align: center;'>ยังไม่มีไฟล์เพลงสำหรับผลงานนี้</p>`;
      }
    }
  </script>
</body>
</html>
